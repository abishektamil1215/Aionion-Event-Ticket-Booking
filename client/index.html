<!doctype html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        let theme = 'light';
        try { const saved = localStorage.getItem('aionion-theme'); if (saved === 'light' || saved === 'dark') theme = saved; } catch {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050816" />
    <meta name="description" content="Aionion Events — expert-led market conversations, investor sessions, workshops and private client experiences by Aionion Capital." />
    <title>Aionion Events — Finance. Conversations. Access.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Sora:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  </head>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
